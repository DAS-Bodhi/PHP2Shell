title: Web Service Process Spawned a Shell
id: c3f7e5a4-9d16-4f4c-b153-4e8a0d6f32c9
status: experimental
description: >
  Detects a web service process (apache2, httpd, php, php-fpm) directly
  spawning a shell. Web servers do not legitimately launch interactive shells;
  this parent-child relationship is a high-fidelity web shell indicator.
author: Bodhisattwa Das
date: 2026/10/25
references:
  - https://attack.mitre.org/techniques/T1505/003/
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '/apache2'
      - '/httpd'
      - '/php'
      - '/php-fpm'
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
  condition: selection
falsepositives:
  - Web apps that legitimately shell out (should be allowlisted)
level: high
tags:
  - attack.execution
  - attack.t1059
  - attack.persistence
  - attack.t1505.003
